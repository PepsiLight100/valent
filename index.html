<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentinsdate ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffe6eb, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Wrapper */
.wrapper {
    width: 100%;
    max-width: 420px;
    text-align: center;
    z-index: 2;
}

h1 {
    font-size: 1.8rem;
    color: #d3003f;
    margin-bottom: 30px;
    line-height: 1.3;
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
}

button {
    width: 160px;
    height: 64px;
    border: none;
    border-radius: 16px;
    font-size: 1.6rem;
    cursor: pointer;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
    z-index: 2;
}

#noBtn {
    background: #ddd;
    color: #555;
    z-index: 3;
}

/* Nachricht */
#message {
    display: none;
    font-size: 1.4rem;
    color: #d3003f;
    line-height: 1.5;
}

/* Herzen */
.heart {
    position: fixed;
    bottom: -20px;
    animation: floatUp linear infinite;
    opacity: 0.8;
    z-index: 1;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Konfetti */
#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

/* Mobile */
@media (max-width: 600px) {
    button {
        width: 140px;
        height: 56px;
        font-size: 1.4rem;
    }
}
</style>
</head>

<body>

<div class="wrapper" id="content">
    <h1>Willst du mit mir ein Valentinsdate verbringen? ❤️</h1>
    <div class="buttons">
        <button id="yesBtn">JA!</button>
        <button id="noBtn">NEIN</button>
    </div>
</div>

<div class="wrapper" id="message">
    ❤️❤️❤️<br><br>
    Dann sei bitte ab <b>16 Uhr</b> bei mir zu Hause<br>
    für dein Valentinsdate ab <b>18 Uhr in Dortmund</b> 💕<br><br>
    📧 Diese Information wurde mir per E-Mail zugesendet.
</div>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
/* ===============================
   EMAILJS INITIALISIERUNG
================================ */
(function () {
    emailjs.init("eWbToRDAMN-e3Ddre");
})();

/* ===============================
   NEIN BUTTON – SPRINGT MIT SPERRZONE
================================ */
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function moveNo() {
    noBtn.style.position = "fixed";

    const yesRect = yesBtn.getBoundingClientRect();
    const padding = 40;

    let x, y, safe;

    do {
        x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

        safe =
            x + noBtn.offsetWidth < yesRect.left - padding ||
            x > yesRect.right + padding ||
            y + noBtn.offsetHeight < yesRect.top - padding ||
            y > yesRect.bottom + padding;

    } while (!safe);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* ===============================
   JA BUTTON – AKTION + E-MAIL
================================ */
yesBtn.addEventListener("click", () => {
    document.getElementById("content").style.display = "none";
    document.getElementById("message").style.display = "block";
    launchConfetti();

    emailjs.send(
        "service_8ct4a1p",
        "template_rhj8rxf",
        {
            message: "JA wurde geklickt ❤️ Valentinsdate bestätigt!"
        },
        "eWbToRDAMN-e3Ddre"
    ).then(() => {
        console.log("✅ E-Mail erfolgreich gesendet");
    }).catch((error) => {
        console.error("❌ EmailJS Fehler:", error);
    });
});

/* ===============================
   HERZEN
================================ */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 22) + "px";
    heart.style.animationDuration = (5 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 9000);
}
setInterval(createHeart, 600);

/* ===============================
   KONFETTI
================================ */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function launchConfetti() {
    let pieces = Array.from({ length: 120 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        r: Math.random() * 6 + 4,
        dx: (Math.random() - 0.5) * 10,
        dy: (Math.random() - 0.5) * 10,
        color: `hsl(${Math.random() * 360},100%,60%)`
    }));

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p, i) => {
            p.x += p.dx;
            p.y += p.dy;
            p.dy += 0.25;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            if (p.y > canvas.height) pieces.splice(i, 1);
        });
        if (pieces.length) requestAnimationFrame(update);
    }
    update();
}
</script>

</body>
</html>
