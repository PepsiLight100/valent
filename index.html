<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentinsdate ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffe6eb, #fff);
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Hauptwrapper zentriert */
.wrapper {
    max-width: 420px;
    width: 100%;
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 2rem;
    color: #d3003f;
    margin-bottom: 25px;
    line-height: 1.3;
}

.buttons {
    display: flex;
    justify-content: space-between; /* Nebeneinander */
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
}

button {
    padding: 16px 28px;
    border: none;
    border-radius: 14px;
    font-size: 1.6rem;
    cursor: pointer;
    flex: 1 1 45%; /* Buttons skalieren mobil */
}

#yesBtn {
    background: #ff4d6d;
    color: white;
    font-size: 2.2rem;
    flex-grow: 2;
}

#noBtn {
    background: #ddd;
    color: #555;
    position: relative; /* wird bewegt */
    z-index: 3;
}

#message {
    display: none;
    font-size: 1.4rem;
    color: #d3003f;
    line-height: 1.4;
    margin-top: 20px;
}

/* Herzen */
.heart {
    position: fixed;
    bottom: -20px;
    animation: floatUp linear infinite;
    opacity: 0.8;
    z-index: 1;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Mobile Anpassung */
@media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    button { font-size: 1.4rem; padding: 14px 20px; }
    #yesBtn { font-size: 1.9rem; }
}
</style>
</head>

<body>

<div class="wrapper" id="content">
    <h1>Willst du mit mir ein Valentinsdate verbringen? ❤️</h1>
    <div class="buttons">
        <button id="yesBtn">JA!</button>
        <button id="noBtn">NEIN</button>
    </div>
</div>

<div class="wrapper" id="message">
    ❤️❤️❤️<br><br>
    Dann sei bitte ab <b>16 Uhr</b> bei mir zu Hause<br>
    für dein Valentinsdate ab <b>18 Uhr in Dortmund</b> 💕<br><br>
    📧 Diese Information wurde mir per E-Mail zugesendet.
</div>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
/* EmailJS */
(function(){ emailjs.init("DeWbToRDAMN-e3Ddre"); })();

/* NEIN BUTTON – springt bei Hover / Tippen */
const noBtn = document.getElementById("noBtn");
let speed = 300;

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo); // mobil

function moveNo() {
    speed = Math.max(100, speed - 30);
    const padding = 10;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    noBtn.style.transition = `all ${speed}ms ease`;
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

/* JA BUTTON */
document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("content").style.display = "none";
    document.getElementById("message").style.display = "block";
    launchConfetti();

    emailjs.send("service_8ct4a1p", "template_rhj8rxf", {
        message: "JA wurde geklickt ❤️ Valentinsdate bestätigt!"
    });
});

/* HERZEN */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    heart.style.animationDuration = (5 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 9000);
}
setInterval(createHeart, 600);

/* KONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function launchConfetti() {
    let pieces = [];
    for (let i=0; i<120; i++) {
        pieces.push({
            x: canvas.width/2,
            y: canvas.height/2,
            r: Math.random()*6+4,
            dx: (Math.random()-0.5)*10,
            dy: (Math.random()-0.5)*10,
            color: `hsl(${Math.random()*360},100%,60%)`
        });
    }

    function update() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach((p,i)=>{
            p.x += p.dx;
            p.y += p.dy;
            p.dy += 0.25;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.fill();
            if(p.y>canvas.height) pieces.splice(i,1);
        });
        if(pieces.length) requestAnimationFrame(update);
    }
    update();
}
</script>

</body>
</html>
